# Automated dependency updates. This project reads untrusted files and calls
# out over HTTP on a schedule, so an unpatched parser or HTTP-client CVE is
# reachable from the data a pipeline processes rather than only from the host.
# Every ecosystem waits 7 days before proposing a new release (cooldown), so a
# compromised or broken release is usually pulled before it reaches this repository.
# Security updates are not delayed: advisories raise them immediately.
version: 2
updates:
  # Runtime dependencies keep permissive lower bounds on purpose: raising a
  # `>=` floor narrows the install matrix without fixing anything, and CI
  # already installs the newest resolvable versions on every run. So routine
  # version PRs are limited to the development toolchain. Security fixes are
  # not limited by this list - they arrive as Dependabot *security* updates,
  # which are driven by advisories rather than by the allow-list below.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    allow:
      - dependency-name: "pytest*"
      - dependency-name: "ruff"
      - dependency-name: "mypy"
      - dependency-name: "coverage*"
      - dependency-name: "types-*"
    groups:
      dev-tooling:
        patterns: ["*"]
    labels: ["dependencies"]

  # Every action is pinned to a commit SHA; this keeps the pins current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    labels: ["dependencies", "ci"]

  # The base image is pinned by digest in docker/Dockerfile. Digest refreshes
  # (the same Python and Debian, patched) arrive weekly; moving to a new Python
  # minor or a new Debian release is a decision, not a bot PR.
  - package-ecosystem: docker
    directory: "/docker"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    labels: ["dependencies", "docker"]
