name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

permissions:
  contents: read

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev,columnar,excel,remote,api]"

      - name: Ruff (lint)
        run: ruff check --output-format=github .

      - name: Ruff (format)
        run: ruff format --check .

      - name: mypy
        run: mypy

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev,columnar,excel,remote,api]"

      - name: Test
        run: pytest --cov=ironflow --cov-report=xml --cov-report=term -q

      - name: Enforce coverage floor
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: coverage report --fail-under=88

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  minimal-install:
    name: Slim install (no optional extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # The optional connectors must degrade with an actionable message rather
      # than breaking the import, so a slim container still runs CSV/SQL/REST.
      - name: Install without extras
        run: pip install -e ".[dev]"

      - name: Import and CLI smoke test
        run: |
          python -c "import ironflow, ironflow.connectors; print(ironflow.__version__)"
          ironflow version
          ironflow connectors list

      - name: Core suites must pass without extras
        run: pytest tests/test_core.py tests/test_security.py tests/test_expressions.py
             tests/test_config.py tests/test_orchestration.py -q

  integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ironflow
          POSTGRES_PASSWORD: ironflow
          POSTGRES_DB: ironflow
        options: >-
          --health-cmd "pg_isready -U ironflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev,columnar,excel,api,postgres]"

      - name: Run the suite against PostgreSQL state
        env:
          IRONFLOW_STATE_DATABASE_URL: postgresql+psycopg://ironflow:ironflow@localhost:5432/ironflow
        run: pytest -m integration -q

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          pip install -e ".[dev,columnar,excel,remote,api]"
          pip install pip-audit

      # ruff's bandit rules (S) run in the lint job; this is the dependency side.
      - name: Audit dependencies for known vulnerabilities
        run: pip-audit --strict --desc
        continue-on-error: true   # advisory: a new CVE must not block an unrelated PR

      - name: Fail on committed secrets
        run: |
          if git grep -nIE '(IRONFLOW_ENCRYPTION_KEY|JWT_SECRET|PASSWORD)[[:space:]]*=[[:space:]]*[A-Za-z0-9+/=_-]{12,}' \
             -- ':!*.example' ':!docs/*' ':!tests/*' ':!.github/*'; then
            echo "::error::a credential-shaped literal was committed"
            exit 1
          fi

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: ironflow:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run --rm ironflow:ci version
          docker run --rm ironflow:ci connectors list
