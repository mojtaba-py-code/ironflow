name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

# Every job reads the repository and nothing else. A job that needs more asks
# for it by name, so a compromised step inherits no write access.
permissions:
  contents: read

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # persist-credentials: false on every checkout - no later step has any
      # reason to hold the job token in .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev,columnar,excel,remote,api]"

      - name: Ruff (lint)
        run: ruff check --output-format=github .

      - name: Ruff (format)
        run: ruff format --check .

      - name: mypy
        run: mypy

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          # Windows and macOS each resolve paths their own way - drive letters
          # and UNC prefixes, /var -> /private/var - and path confinement is a
          # security control here, so both run the whole suite.
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev,columnar,excel,remote,api]"

      - name: Test
        run: pytest --cov=ironflow --cov-report=xml --cov-report=term -q

      - name: Enforce coverage floor
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: coverage report --fail-under=89

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  minimal-install:
    name: Slim install (no optional extras)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # The optional connectors must degrade with an actionable message rather
      # than breaking the import, so a slim container still runs CSV/SQL/REST.
      - name: Install without extras
        run: pip install -e ".[dev]"

      - name: Import and CLI smoke test
        run: |
          python -c "import ironflow, ironflow.connectors; print(ironflow.__version__)"
          ironflow version
          ironflow connectors list

      - name: Core suites must pass without extras
        run: pytest tests/test_core.py tests/test_security.py tests/test_expressions.py
             tests/test_config.py tests/test_orchestration.py tests/test_pipeline_confinement.py -q

  integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ironflow
          # A throwaway service container that lives for this job only.
          POSTGRES_PASSWORD: ironflow
          POSTGRES_DB: ironflow
        options: >-
          --health-cmd "pg_isready -U ironflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev,columnar,excel,api,postgres]"

      - name: Run the suite against PostgreSQL state
        env:
          IRONFLOW_STATE_DATABASE_URL: postgresql+psycopg://ironflow:ironflow@localhost:5432/ironflow
        run: pytest -m integration -q

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: ironflow:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The restrictions production should apply, so an image that quietly
      # needs a writable root, root privileges or a capability fails here.
      - name: Smoke test under production restrictions
        run: |
          set -euo pipefail
          hardened=(--rm --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges)
          docker run "${hardened[@]}" ironflow:ci version
          docker run "${hardened[@]}" ironflow:ci connectors list
          test "$(docker run --rm --entrypoint id ironflow:ci -u)" = "1001"

      # Grype rather than Trivy: Trivy's GitHub Actions had 76 of 77 version
      # tags force-pushed to a credential stealer in March 2026. Fails on any
      # high or critical vulnerability that already has a fix.
      - name: Scan the image for known vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ironflow:ci
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
