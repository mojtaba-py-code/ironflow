# Supply-chain and secret checks. ci.yml answers "does the code work"; this
# answers "did anything dangerous get in", and it also runs weekly, because an
# advisory published tomorrow applies to code that has not changed.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Its own environment, so the audit covers exactly what a full install
      # resolves to - not pip-audit's dependencies or the runner's packages.
      - name: Install IronFlow with every optional extra
        run: |
          python -m venv /tmp/audited
          /tmp/audited/bin/python -m pip install --upgrade pip
          /tmp/audited/bin/python -m pip install ".[columnar,excel,remote,api,postgres,mysql]"

      - name: Install pip-audit
        run: python -m pip install "pip-audit==2.10.1"

      # IronFlow itself is left out of the list: it is not on PyPI, so it
      # cannot be looked up, and --strict rightly counts that as a failure.
      # The previous job audited an environment that contained the project
      # with --strict, failed on that lookup every single run, and hid it
      # behind continue-on-error - so it never reported an advisory at all.
      - name: Audit every installed distribution
        run: |
          set -euo pipefail
          /tmp/audited/bin/python -m pip freeze --all --exclude-editable \
            | grep -viE '^ironflow( |==|@)' > /tmp/audited.txt
          echo "auditing $(wc -l < /tmp/audited.txt) distributions"
          pip-audit --strict --desc on --no-deps --disable-pip \
            --requirement /tmp/audited.txt --progress-spinner off

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every commit, not only the tip
          persist-credentials: false

      # The MIT-licensed binary, pinned by version *and* checksum: a release
      # asset replaced after the fact fails here instead of running.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # --redact keeps any match out of the build log, so a leak is reported
      # without the log becoming a second copy of the secret.
      - name: Scan every commit
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose

      - name: Scan the working tree
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner --verbose

      - name: Project scanner
        run: python3 scripts/check_secrets.py

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Blocks a pull request that adds a dependency with a known advisory.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never
