# OpenSSF Scorecard: an outside, automated opinion of this repository's
# supply-chain hygiene - pinned dependencies, token permissions, branch
# protection, signed releases, dangerous workflow patterns. Results go to code
# scanning, and are published to the OpenSSF API for the README badge.
#
# Publishing constrains the workflow on purpose: no top-level write
# permissions and no `run:` steps, so the result cannot be forged from here.
name: Scorecard

on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: "35 3 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write # upload the results to code scanning
      id-token: write # sign the results published to the OpenSSF API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
