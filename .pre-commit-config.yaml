# Install once:  pre-commit install
# Run on demand:  pre-commit run --all-files
#
# The hooks mirror the CI lint job, so a red build is caught before the push
# rather than after it.

default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      # A committed key or dump is the failure this whole project guards against.
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=512]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        files: ^src/ironflow/
        additional_dependencies:
          - pydantic>=2.7
          - pydantic-settings>=2.2
          - types-PyYAML
          - types-psutil

  - repo: local
    hooks:
      # Fast feedback only. The full suite runs in CI; a pre-commit hook that
      # takes two minutes gets bypassed with --no-verify, which is worse.
      - id: pytest-fast
        name: pytest (core suites)
        entry: python -m pytest tests/test_core.py tests/test_security.py
               tests/test_expressions.py -q
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: no-literal-secrets
        name: no credential-shaped literals
        entry: python scripts/check_secrets.py
        language: system
        pass_filenames: false
        stages: [pre-commit]
