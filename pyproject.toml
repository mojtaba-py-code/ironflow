[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ironflow"
version = "1.0.0"
description = "Enterprise ETL data pipeline platform: pluggable connectors, streaming transformations, validation, orchestration and observability."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mojtaba Karimi", email = "mojtaba.python@gmail.com" }]
keywords = ["etl", "data-engineering", "pipeline", "orchestration", "data-quality"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "PyYAML>=6.0,<7",
    "SQLAlchemy>=2.0,<3",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27,<1",
    "cryptography>=42",
    "python-dotenv>=1.0",
    "psutil>=5.9",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
columnar = ["pyarrow>=15", "pandas>=2.2"]
excel = ["openpyxl>=3.1"]
remote = ["paramiko>=3.4"]
api = ["fastapi>=0.111", "uvicorn[standard]>=0.53.0"]
postgres = ["psycopg[binary]>=3.1"]
mysql = ["PyMySQL>=1.1"]
dev = [
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML",
    "types-psutil",
]
all = [
    "ironflow[columnar,excel,remote,api,postgres,mysql]",
]

[project.urls]
Homepage = "https://github.com/mojtaba-py-code/ironflow"
Documentation = "https://github.com/mojtaba-py-code/ironflow/tree/main/docs"
Issues = "https://github.com/mojtaba-py-code/ironflow/issues"

[project.scripts]
ironflow = "ironflow.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ironflow*"]

[tool.setuptools.package-data]
ironflow = ["py.typed"]

# --------------------------------------------------------------------------- #
# Tooling
# --------------------------------------------------------------------------- #

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "integration: tests that touch the filesystem or a real database engine",
    "slow: tests that take a noticeable amount of wall-clock time",
]
filterwarnings = ["error::DeprecationWarning:ironflow.*"]

[tool.coverage.run]
branch = true
source = ["ironflow"]
omit = ["*/api/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
    "class .*\\(Protocol\\):",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "PTH",       # use pathlib
    "RET",       # return
    "ARG",       # unused arguments
    "S",         # bandit security rules
    "DTZ",       # naive datetimes
    "TRY",       # exception anti-patterns
    "RUF",
]
ignore = [
    # Long messages inside `raise` are the point: an operator reads them at 03:00.
    "TRY003",
    # logger.exception vs logger.error is a per-call-site judgement about whether
    # the traceback adds anything.
    "TRY400",
    "S101",    # assert is used for invariants the type checker cannot express
    "B008",    # Typer requires calls in argument defaults
    "RET504",  # named result variables aid debugging
    # Hook and protocol methods legitimately ignore arguments they are handed;
    # the signature is fixed by the interface, not by this implementation.
    "ARG002",
    "ARG005",
    # `class X(str, Enum)` is deliberate. Every call site serialises `.value`
    # explicitly; switching to StrEnum would silently change `f"{x}"` output.
    "UP042",
    # Optional lifecycle hooks (`_on_open`, `_on_close`) are intentionally empty
    # in the base class - they are extension points, not abstract methods.
    "B027",
    "B024",
    # `ironflow.core.errors.ConnectionError` deliberately mirrors the builtin
    # name; renaming it to `...Error` would break that symmetry.
    "N818",
    # strptime without %z is intentional: source timestamps rarely carry a zone
    # and the `convert_timezone` transformation applies it explicitly.
    "DTZ007",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S105", "S106", "S108", "ARG001", "ARG002", "S311", "SLF001",
    # Test doubles subclass/patch ftplib; no real FTP connection is made.
    "S321",
    # Test fixtures use plain class-level containers deliberately.
    "RUF012",
]
"src/ironflow/cli/*" = ["ARG001"]
# ftplib is flagged wholesale by bandit; this module defaults to FTP_TLS and
# refuses plain FTP in production, which is the mitigation the rule asks for.
"src/ironflow/connectors/remote.py" = ["S321"]

[tool.ruff.lint.isort]
known-first-party = ["ironflow"]

[tool.mypy]
python_version = "3.11"
files = ["src/ironflow"]
strict = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
ignore_missing_imports = true

# numpy's bundled stubs use PEP 695 `type X = ...` statements, which mypy refuses
# to parse while `python_version` is pinned to 3.11 - and that one syntax error
# aborts the entire run, so the whole type check silently stops being a check.
# IronFlow never imports numpy itself; it arrives behind pandas in the optional
# `columnar` extra. `follow_imports_for_stubs` is what makes `skip` apply to a
# `.pyi` at all. Keeping `python_version` at 3.11 matters more: it is the version
# the package claims to support, and lowering the bar would let a 3.12-only
# construct reach a 3.11 user.
#
# mypy 2.x no longer needs this and reports the section as unused; the override
# stays for anyone still on 1.x, where its absence aborts the whole run.
[[tool.mypy.overrides]]
module = ["numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true
